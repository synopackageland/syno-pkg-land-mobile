<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Package Land" />
    <meta name="referrer" content="same-origin" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- DSM's own icons, from DSM's origin, as DSM's login page lists them (src/core/install/dsm-icons.ts) -->
    <link rel="icon" href="/webman/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/webman/resources/images/icon_dsm_96.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/webman/resources/images/icon_dsm_64.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/webman/resources/images/icon_dsm_48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/webman/resources/images/icon_dsm_32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/webman/resources/images/icon_dsm_16.png" />
    <link rel="apple-touch-icon" href="/webman/resources/images/icon_dsm_96.png" />
    <link rel="mask-icon" href="/webman/safari_pin_icon.svg" color="#0086E5" />
    <title>Package Land</title>
    <script>
      // Another NAS's launcher checks for this one (Add NAS) by loading it in a hidden frame with
      // ?spl-probe=1. Only then: answer with a fixed message that carries no data, and stop loading.
      if (window.parent !== window && /(?:^\?|&)spl-probe=1(?:&|$)/.test(location.search)) {
        try { window.parent.postMessage({ 'spl-launcher': 1 }, '*'); } catch (e) {}
        window.stop();
      }
    </script>
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #FFFFFF; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      /* Screens slide in and out with transforms: clipped here, they never widen the page, which
         would make a phone browser lay the page out wider than the screen and let it pan sideways */
      #root { display: flex; height: 100%; flex: 1; overflow: hidden; }
      /* A phone held sideways: the notch and rounded corners sit at the sides (the App's bars pad the top and
         bottom); the page's white shows beneath them. viewport-fit=cover makes these insets apply */
      #root { box-sizing: border-box; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
    </style>
  </head>
  <body>
    <noscript>Package Land needs JavaScript</noscript>
    <div id="root"></div>
  </body>
</html>
